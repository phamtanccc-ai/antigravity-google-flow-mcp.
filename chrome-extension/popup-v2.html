<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SangamFlow</title>
  <link rel="stylesheet" href="styles/themes/professional-dark.css">
  <style>
    body {
      width: 380px;
      min-height: 500px;
      margin: 0;
      padding: 0;
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-primary);
      padding: var(--spacing-md);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      margin-bottom: var(--spacing-sm);
    }

    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: var(--radius-md);
    }

    .brand-name {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-version {
      font-size: 10px;
      color: var(--text-tertiary);
      margin-left: auto;
    }

    /* Status Section */
    .status-section {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-primary);
    }

    .status-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: var(--spacing-sm);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-sm);
    }

    .status-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .status-value {
      display: flex;
      align-items: center;
      gap: var(--spacing-xs);
      font-size: 12px;
      font-weight: 500;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-dot.connected {
      background: var(--success);
      box-shadow: 0 0 8px var(--success);
    }

    .status-dot.disconnected {
      background: var(--error);
    }

    /* MCP Server Selector */
    .mcp-section {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-primary);
    }

    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--spacing-sm);
    }

    .mcp-selector {
      display: flex;
      gap: var(--spacing-sm);
    }

    .mcp-selector select {
      flex: 1;
    }

    /* Account Selector */
    .account-section {
      padding: var(--spacing-md);
      border-bottom: 1px solid var(--border-primary);
    }

    .account-card {
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-primary);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .account-card:hover {
      border-color: var(--accent-primary);
    }

    .account-card.active {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(0, 212, 170, 0.1);
    }

    .account-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg-primary);
      font-weight: 600;
      font-size: 12px;
    }

    .account-info {
      flex: 1;
    }

    .account-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .account-email {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .account-plan {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: var(--radius-sm);
      background: rgba(0, 212, 170, 0.15);
      color: var(--accent-primary);
    }

    .account-plan.pro {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent-secondary);
    }

    /* Quick Actions */
    .actions-section {
      padding: var(--spacing-md);
      flex: 1;
    }

    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--spacing-sm);
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-xs);
      padding: var(--spacing-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-primary);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .action-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-primary);
      transform: translateY(-2px);
    }

    .action-icon {
      font-size: 24px;
    }

    .action-label {
      font-size: 12px;
      color: var(--text-secondary);
    }

    /* Active Jobs */
    .jobs-section {
      padding: var(--spacing-md);
      border-top: 1px solid var(--border-primary);
    }

    .job-item {
      padding: var(--spacing-sm);
      background: var(--bg-tertiary);
      border-radius: var(--radius-md);
      margin-bottom: var(--spacing-sm);
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--spacing-xs);
    }

    .job-type {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .job-status {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .job-progress {
      width: 100%;
    }

    /* Footer */
    .footer {
      padding: var(--spacing-md);
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-primary);
    }

    .footer-actions {
      display: flex;
      gap: var(--spacing-sm);
    }

    .footer-actions button {
      flex: 1;
    }

    /* Loading State */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--spacing-xl);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-primary);
      border-top-color: var(--accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Error State */
    .error-message {
      padding: var(--spacing-md);
      background: rgba(244, 33, 46, 0.1);
      border: 1px solid rgba(244, 33, 46, 0.3);
      border-radius: var(--radius-md);
      color: var(--error);
      font-size: 12px;
      margin: var(--spacing-sm);
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="brand">
        <img src="icons/icon128.png" alt="SangamFlow" class="brand-logo">
        <span class="brand-name">SangamFlow</span>
        <span class="brand-version">v2.0.0</span>
      </div>
    </div>

    <!-- Status Section -->
    <div class="status-section">
      <div class="status-item">
        <span class="status-label">WebSocket Bridge</span>
        <div class="status-value">
          <span id="ws-status-text">Checking...</span>
          <span id="ws-status-dot" class="status-dot disconnected"></span>
        </div>
      </div>
      <div class="status-item">
        <span class="status-label">Google Flow</span>
        <div class="status-value">
          <span id="flow-status-text">Not Connected</span>
          <span id="flow-status-dot" class="status-dot disconnected"></span>
        </div>
      </div>
    </div>

    <!-- MCP Server Selector -->
    <div class="mcp-section">
      <div class="section-title">MCP Server</div>
      <div class="mcp-selector">
        <select id="mcp-server-select" class="select">
          <option value="sangamflow-local">SangamFlow Local</option>
          <option value="sangamflow-remote">SangamFlow Cloud</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="refresh-servers" title="Refresh Servers">
          ↻
        </button>
      </div>
    </div>

    <!-- Account Selector -->
    <div class="account-section">
      <div class="section-title">Google Account</div>
      <div id="accounts-list"></div>
      <button class="btn btn-secondary btn-sm" id="add-account" style="width: 100%; margin-top: var(--spacing-sm);">
        + Add Account
      </button>
    </div>

    <!-- Quick Actions -->
    <div class="actions-section">
      <div class="section-title">Quick Actions</div>
      <div class="action-grid">
        <button class="action-btn" id="action-generate-video">
          <span class="action-icon">🎬</span>
          <span class="action-label">Generate Video</span>
        </button>
        <button class="action-btn" id="action-generate-image">
          <span class="action-icon">🖼️</span>
          <span class="action-label">Generate Image</span>
        </button>
        <button class="action-btn" id="action-upload-character">
          <span class="action-icon">👤</span>
          <span class="action-label">Upload Character</span>
        </button>
        <button class="action-btn" id="action-view-jobs">
          <span class="action-icon">📋</span>
          <span class="action-label">View Jobs</span>
        </button>
      </div>
    </div>

    <!-- Active Jobs -->
    <div class="jobs-section" id="jobs-section" style="display: none;">
      <div class="section-title">Active Jobs</div>
      <div id="jobs-list"></div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <div class="footer-actions">
        <button class="btn btn-secondary" id="open-sidepanel">
          Open Panel
        </button>
        <button class="btn btn-secondary" id="open-settings">
          ⚙️ Settings
        </button>
      </div>
    </div>
  </div>

  <script src="popup-v2.js"></script>
</body>
</html>
